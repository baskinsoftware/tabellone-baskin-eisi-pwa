# App Android (Capacitor) dalla stessa cartella pwa/.
#   - tag v* (es. v26.0b19, v26.0) -> APK nella release del tag (pre-release per a/b/RC);
#     il workflow Release lo avvia sul tag che crea (interruttore «App Android»)
#   - lancio manuale     -> APK solo tra gli artifact dell'esecuzione
#   - ogni esecuzione    -> APK anche tra gli artifact dell'esecuzione
# Nessuna build automatica sui push dei rami: niente più pre-release «app-beta».
# Senza secret di firma si produce l'APK «debug» (installabile, firma di sviluppo).
# Con i secret KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD si
# produce anche l'APK «release» firmato con la chiave del progetto.
name: App Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Cache delle dipendenze Gradle: dopo il primo build riuscito non si riscaricano
      # (meno richieste a Maven Central, che a volte risponde 429 Too Many Requests).
      # Scrittura attiva anche sui tag, da cui partono i build avviati da Release.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Dipendenze e versione
        run: |
          npm ci
          node tools/versione-app.mjs

      - name: Copia la PWA nel progetto Android
        run: npx cap sync android

      - name: APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          # fino a 3 tentativi, per gli errori temporanei di rete (es. 429 da Maven Central)
          for i in 1 2 3; do
            ./gradlew --no-daemon assembleDebug && exit 0
            [ $i -lt 3 ] && { echo "::warning::Tentativo $i non riuscito, riprovo tra $((i*60)) secondi"; sleep $((i*60)); }
          done
          exit 1

      - name: APK release firmato (se ci sono i secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          TBE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TBE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TBE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Nessun keystore: solo APK debug"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export TBE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          for i in 1 2 3; do
            ./gradlew --no-daemon assembleRelease && exit 0
            [ $i -lt 3 ] && { echo "::warning::Tentativo $i non riuscito, riprovo tra $((i*60)) secondi"; sleep $((i*60)); }
          done
          exit 1

      - name: Raccoglie gli APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Tabellone-Baskin-EISI-${APP_VER}-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/Tabellone-Baskin-EISI-${APP_VER}.apk"
          fi
          ls -la out

      - uses: actions/upload-artifact@v5
        with:
          name: Tabellone-Baskin-EISI-${{ env.APP_VER }}-android
          path: out/

      - name: Release del tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'RC') }}
          files: out/*.apk
