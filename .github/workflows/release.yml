# release.yml by Daniele Lolli (UncleDan) feat. Claude AI - Release 1.3 - 2026-11-24 23-37-54
#
# Crea una release GitHub con lancio manuale (Actions → Release → Run workflow).
# Regola:
#   - titolo = primo titolo "# " del README + spazio + <prefisso><versione>
#   - tag    = <prefisso><versione>                  (es. v26.1)
#   - testo  = README dalla prima riga non vuota dopo il titolo, fino alla fine
# Nessun percorso fisso: README, ramo e prefisso sono parametri; i file dei workflow
# delle app sono nelle variabili WF_ANDROID e WF_IOS qui sotto (in "env"), così il
# file si riusa in altri repository cambiando solo quelle due righe.
#
# Nota: un tag creato con GITHUB_TOKEN non avvia gli altri workflow "on: push tags".
# Per questo gli interruttori "App Android" / "App iOS" li avviano sul nuovo tag;
# in "altri_workflow" se ne possono aggiungere altri.
name: Release

on:
  workflow_dispatch:
    inputs:
      versione:
        description: "Versione, senza prefisso (es. 26.1, 26.0.1, 26.1b2)"
        required: true
        type: string
      ramo:
        description: "Ramo o commit da cui creare la release"
        required: false
        default: "main"
        type: string
      readme:
        description: "Percorso del README nel repository"
        required: false
        default: "README.md"
        type: string
      prefisso_tag:
        description: "Prefisso del tag e del titolo"
        required: false
        default: "v"
        type: string
      prerelease:
        description: "Segna come pre-release (automatico per aN, bN, RCN)"
        required: false
        default: false
        type: boolean
      bozza:
        description: "Crea come bozza (non pubblicata)"
        required: false
        default: false
        type: boolean
      app_android:
        description: "App Android"
        required: false
        default: true
        type: boolean
      app_ios:
        description: "App iOS"
        required: false
        default: false
        type: boolean
      altri_workflow:
        description: "Altri workflow da avviare sul nuovo tag, separati da spazio (vuoto = nessuno)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

env:
  WF_ANDROID: app-android.yml   # workflow della app Android
  WF_IOS: app-ios.yml           # workflow della app iOS

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSIONE: ${{ inputs.versione }}
      RAMO: ${{ inputs.ramo }}
      README_PATH: ${{ inputs.readme }}
      PREFISSO: ${{ inputs.prefisso_tag }}
      PRERELEASE: ${{ inputs.prerelease }}
      BOZZA: ${{ inputs.bozza }}
      APP_ANDROID: ${{ inputs.app_android }}
      APP_IOS: ${{ inputs.app_ios }}
      ALTRI_WORKFLOW: ${{ inputs.altri_workflow }}
    steps:
      - name: Checkout del ramo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ramo }}
          fetch-depth: 1

      - name: Titolo, tag e testo dal README
        id: dati
        shell: bash
        run: |
          set -euo pipefail
          VERSIONE="$(printf '%s' "$VERSIONE" | tr -d '[:space:]')"
          VERSIONE="${VERSIONE#"$PREFISSO"}"   # accetta anche "v26.1"
          [ -n "$VERSIONE" ] || { echo "::error::Versione vuota"; exit 1; }
          # Regola di versioning Baskin (v3): AA.M[.P[.W]] con eventuale suffisso aN, bN o RCN
          [[ "$VERSIONE" =~ ^[0-9]{2}\.[0-9]{1,2}(\.[0-9]{1,2}(\.[1-9])?)?((a|b|RC)[0-9]{1,2})?$ ]] \
            || { echo "::error::Versione non conforme alla regola AA.M[.P[.W]][aN|bN|RCN]: $VERSIONE"; exit 1; }
          [[ "$VERSIONE" =~ (a|b|RC)[0-9]+$ ]] && PRERELEASE=true   # alpha, beta e RC sono sempre pre-release
          [ -f "$README_PATH" ] || { echo "::error::README non trovato: $README_PATH (ramo $RAMO)"; exit 1; }

          TAG="${PREFISSO}${VERSIONE}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Il tag $TAG esiste già"; exit 1
          fi

          # riga del primo titolo "# " (non "## ")
          RIGA_TITOLO="$(grep -n -m1 -E '^# ' "$README_PATH" | cut -d: -f1 || true)"
          [ -n "$RIGA_TITOLO" ] || { echo "::error::Nessun titolo '# ' in $README_PATH"; exit 1; }
          TITOLO="$(sed -n "${RIGA_TITOLO}p" "$README_PATH" | sed -E 's/^# +//; s/[[:space:]]+$//; s/\r$//')"
          NOME="$TITOLO $TAG"

          # testo: dalla prima riga non vuota dopo il titolo fino alla fine
          NOTE_FILE="$RUNNER_TEMP/note-release.md"
          tail -n +"$((RIGA_TITOLO + 1))" "$README_PATH" \
            | awk 'BEGIN{p=0} { if (!p && $0 ~ /^[[:space:]\r]*$/) next; p=1; print }' > "$NOTE_FILE"

          {
            echo "tag=$TAG"
            echo "nome=$NOME"
            echo "note=$NOTE_FILE"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release da creare"
            echo "- **Titolo:** $NOME"
            echo "- **Tag:** $TAG"
            echo "- **Ramo:** $RAMO ($(git rev-parse --short HEAD))"
            echo "- **Testo:** $README_PATH dalla riga $(( RIGA_TITOLO + 1 )) in poi (prima riga non vuota)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Crea la release
        shell: bash
        env:
          TAG: ${{ steps.dati.outputs.tag }}
          NOME: ${{ steps.dati.outputs.nome }}
          NOTE_FILE: ${{ steps.dati.outputs.note }}
        run: |
          set -euo pipefail
          OPZ=()
          [ "$PRERELEASE" = "true" ] && OPZ+=(--prerelease)
          [ "$BOZZA" = "true" ] && OPZ+=(--draft)
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "$NOME" \
            --notes-file "$NOTE_FILE" \
            "${OPZ[@]}"
          echo "- **Release:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Avvia i workflow sul nuovo tag
        if: ${{ !inputs.bozza && (inputs.app_android || inputs.app_ios || inputs.altri_workflow != '') }}
        shell: bash
        env:
          TAG: ${{ steps.dati.outputs.tag }}
        run: |
          set -euo pipefail
          LISTA=""
          [ "$APP_ANDROID" = "true" ] && LISTA="$LISTA $WF_ANDROID"
          [ "$APP_IOS" = "true" ] && LISTA="$LISTA $WF_IOS"
          LISTA="$LISTA $ALTRI_WORKFLOW"
          for WF in $LISTA; do
            echo "Avvio $WF su $TAG"
            gh workflow run "$WF" --repo "$GITHUB_REPOSITORY" --ref "$TAG"
            echo "- **Avviato:** $WF su $TAG" >> "$GITHUB_STEP_SUMMARY"
          done
